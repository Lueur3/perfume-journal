[project]
name = "perfume-journal"
version = "0.1.0"
description = "Personal perfume collection tracker and journal"
readme = "README.md"
authors = [{ name = "Lueur3", email = "Lueur3@users.noreply.github.com" }]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["httpx2>=2.13.1", "mypy>=2.3.1", "pytest>=9.1.1", "ruff>=0.16.9"]
